[workspace]
members = [
    "backend",
    "frontend",
"shared_core",
]
resolver = "2"

[workspace.dependencies]
rust_decimal = "1.35.0"
rust_decimal_macros = "1.35.0"
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros"
] }
uuid = { version = "1", features = ["v4", "serde"] }
