[package]
name = "shared_core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fluent = {workspace = true}
uuid = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
unic-langid = { version = "0.9", features = ["serde", "macros"] }
once_cell = "1.19"
include_dir = "0.7"
