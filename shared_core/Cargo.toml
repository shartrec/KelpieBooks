[package]
name = "shared_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
# 💡 Define a specialized feature boundary for server targets
backend = ["dep:sqlx"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
fluent = {workspace = true}
fixed_decimal = "0.5.6"
icu_locid = "1.5"
icu_calendar = "1.5"
icu_datetime = "1.5"
icu_decimal = "1.5"
# Compiled fallback locale data provider (zero network overhead for static layouts)
icu_provider = "1.5"
icu_provider_blob = "1.5"
zerovec = "0.11.3-dev" # for databake
serde = { version = "1.0", features = ["derive"] }

# Make sqlx optional so it remains omitted from default WASM builds
sqlx = { workspace = true, optional = true }

strum = { version = "0.26", features = ["derive"] }
unic-langid = { version = "0.9", features = ["serde", "macros"] }
once_cell = "1.19"
include_dir = "0.7"

[build-dependencies]
icu = "2.0.0"
icu_provider_export = "2.0.0"
icu_provider_source = "2.0.0"
