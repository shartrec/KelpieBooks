[package]
name = "shared_core"
version = "0.1.0"
edition = "2021"

[features]
default = ["ledger"]

backend = ["dep:sqlx"]

# 💡 Define a specialized feature boundary for server targets
ledger = []
partners = ["ledger"]
payables = ["ledger"]
sales = ["ledger", "partners"]
accounts_receivable = ["sales"]
inventory = ["ledger"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
fluent = {workspace = true}
fixed_decimal = "0.5.6"
icu_locid = "2.0"
icu_calendar = "2.2"
icu_datetime = "2.2"
icu_decimal = { version = "2.2", features = ["alloc"] }
# Compiled fallback locale data provider (zero network overhead for static layouts)
icu_provider = "2.2"
icu_provider_blob = "2.2"
zerovec = "0.11.3-dev" # for databake
serde = { version = "1.0", features = ["derive"] }

# Make sqlx optional so it remains omitted from default WASM builds
sqlx = { workspace = true, optional = true }

strum = { version = "0.26", features = ["derive"] }
unic-langid = { version = "0.9", features = ["serde", "macros"] }
include_dir = "0.7"
