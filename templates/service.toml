# Chart of Accounts for a Service-Based Business
#
# This TOML file defines a default chart of accounts that can be imported
# when a new organization is created.
#
# - code: A unique identifier for the account.
# - name: The human-readable name of the account.
# - category: Must be one of 'Asset', 'Liability', 'Equity', 'Revenue', 'Expense'.
# - parent_code: The 'code' of the parent account to create a hierarchy.
# - is_group: If true, this account is a non-postable group header.
# - system_tag: A unique tag for accounts that the system needs to identify
#               for automated processes (e.g., creating invoices, calculating earnings).

# 1000-1999: Assets
# ==============================================================================
[[accounts]]
code = "1000"
name = "Assets"
category = "Asset"
is_group = true

[[accounts]]
code = "1100"
name = "Current Assets"
category = "Asset"
parent_code = "1000"
is_group = true

