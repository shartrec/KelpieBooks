
[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
shared_core = { path = "../shared_core" }

base64 = "0.22.1"
bcrypt = "0.17.0"
chrono = { version = "0.4", features = ["serde"] }
fluent = {workspace = true}
jsonwebtoken = { version = "8.3" }
log = "0.4"
rand = "0.8.5"
rocket = { version = "0.5", features = ["json", "secrets"] }
sqlx = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
typst-assets = { version = "0.11.0", --features = ["fonts"] } # Provides default fonts like Libertine
typst-as-lib = { version = "0.15.4", features= ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.14.2"
typst = "0.14.2"
derive_typst_intoval = "0.6"
uuid = { workspace = true }
csv = "1.4.0"
once_cell = "1.19"
include_dir = "0.7"
unic-langid = { version = "0.9", features = ["serde"] }


[dependencies.rocket_db_pools]
version = "0.2.0"
features = ["sqlx_postgres"]
