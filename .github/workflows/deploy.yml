name: Deploy Zola Site to GitHub Pages

on:
  push:
    branches:
      - master # Change this to 'master' if your default branch uses the older naming convention

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Vital if your Zola theme is cloned as a git submodule

      - name: Install and Build Zola
        # This native action simply downloads the official Zola binary instantly
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build Static Site
        run: |
          # If your Zola site lives in a subdirectory (e.g., "docs" or "website"), 
          # cd into it first: cd my-subfolder && zola build
          cd .docs && zola build

      - name: Upload Production Artifact
        # GitHub's official tool to pack the compiled HTML
        uses: actions/upload-pages-artifact@v3
        with:
          # Crucial: Specify the output folder generated by Zola!
          # If you used a subdirectory above, this would be "my-subfolder/public"
          path: .docs/public

      - name: Deploy to GitHub Pages
        # GitHub's official infrastructure runner to publish the artifact
        id: deployment
        uses: actions/deploy-pages@v4
