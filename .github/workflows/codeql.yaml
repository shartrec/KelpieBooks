name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Build workspace
        run: cargo build --workspace --all-features

      - uses: github/codeql-action/analyze@v3
