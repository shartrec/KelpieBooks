[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[features]
default = ["ledger", "partners", "payables", "sales", "receivables", "inventory"]

# Define your optional modules here
ledger = ["shared_core/ledger"]
partners = ["ledger", "shared_core/partners"]
payables = ["ledger", "partners", "shared_core/payables"]
sales = ["ledger", "partners", "shared_core/sales"]
receivables = ["sales", "shared_core/receivables"]
inventory = ["ledger", "shared_core/inventory"]
# Should be configured in line with backend feature.
password-reset = []


[dependencies]
shared_core = { path = "../shared_core" }
chrono = { version = "0.4", features = ["serde"] }
fluent = {workspace = true}
gloo-net = "0.6.0"
gloo-console = "0.4.0"
gloo-timers = "0.3.0"
gloo-utils = "0.2.0"
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.50"
serde = "1.0.219"
serde_json = "1.0.140"
strum = "0.28.0"
log = "0.4"
console_log = "0.2"
futures = "0.3.31"
base64 = "0.22.1"
urlencoding = "2.1.3"
uuid = { version = "1", features = ["v4", "serde", "js"] }

[dependencies.web-sys]
version = "0.3.77"
features = [
    "CssStyleDeclaration",
    "HtmlDocument",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "HtmlOptionsCollection",
    "HtmlOptionElement",
    "Navigator",
    "Window"
]
